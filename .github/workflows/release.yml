name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: python -m pytest test_index.py -v

  build:
    name: Build (${{ matrix.tag-suffix }})
    runs-on: ${{ matrix.runner }}
    needs: test
    permissions:
      contents: read
      id-token: write
      security-events: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            tag-suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag-suffix: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: stevedore:${{ matrix.tag-suffix }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: stevedore:${{ matrix.tag-suffix }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
          exit-code: 0

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.tag-suffix }}

      - name: Push to ECR Public
        run: |
          docker tag stevedore:${{ matrix.tag-suffix }} public.ecr.aws/advailo/stevedore:${{ github.ref_name }}-${{ matrix.tag-suffix }}
          docker push public.ecr.aws/advailo/stevedore:${{ github.ref_name }}-${{ matrix.tag-suffix }}

  merge:
    name: Merge manifests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Create versioned manifests
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          MAJOR_MINOR=$(echo $VERSION | cut -d. -f1,2)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          REPO=public.ecr.aws/advailo/stevedore

          docker buildx imagetools create \
            -t ${REPO}:${VERSION} \
            -t ${REPO}:${MAJOR_MINOR} \
            -t ${REPO}:${MAJOR} \
            ${REPO}:${VERSION}-amd64 \
            ${REPO}:${VERSION}-arm64

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package Terraform module
        run: zip -r terraform-module.zip terraform/

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            terraform-module.zip
            examples/cloudformation/template.yaml
          body: |
            ## Container image

            ```
            public.ecr.aws/advailo/stevedore:${{ github.ref_name }}
            ```

            > **Lambda users:** Lambda does not support multi-arch manifest lists. Use the arch-specific tag:
            > `public.ecr.aws/advailo/stevedore:${{ github.ref_name }}-amd64` or `-arm64`

            ## Terraform module

            Lambda requires a private ECR image. Mirror first:
            ```bash
            docker pull public.ecr.aws/advailo/stevedore:${{ github.ref_name }}-amd64
            docker tag public.ecr.aws/advailo/stevedore:${{ github.ref_name }}-amd64 \
              123456789012.dkr.ecr.<region>.amazonaws.com/stevedore:${{ github.ref_name }}
            docker push 123456789012.dkr.ecr.<region>.amazonaws.com/stevedore:${{ github.ref_name }}
            ```

            ```hcl
            module "stevedore" {
              source    = "github.com/advailo/stevedore//terraform?ref=${{ github.ref_name }}"
              ecr_arn   = aws_ecr_repository.stevedore.arn
              image_uri = "123456789012.dkr.ecr.<region>.amazonaws.com/stevedore:${{ github.ref_name }}"
            }
            ```

            ## CloudFormation

            Deploy `template.yaml` attached below, or:

            ```bash
            aws cloudformation deploy \
              --template-file template.yaml \
              --stack-name stevedore \
              --capabilities CAPABILITY_NAMED_IAM \
              --parameter-overrides \
                EcrArn=arn:aws:ecr:<region>:123456789012:repository/stevedore \
                ImageUri=123456789012.dkr.ecr.<region>.amazonaws.com/stevedore:${{ github.ref_name }} \
                EcsClusterName=my-cluster \
                EcsClusterArn=arn:aws:ecs:us-east-1:123456789012:cluster/my-cluster \
                VpcId=vpc-xxx \
                SubnetIds=subnet-aaa,subnet-bbb
            ```
