name: Build

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: python -m pytest test_index.py -v

  build:
    name: Build (${{ matrix.tag-suffix }})
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
            tag-suffix: amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            tag-suffix: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build (load locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: stevedore:${{ matrix.tag-suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: stevedore:${{ matrix.tag-suffix }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
          exit-code: 0

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.tag-suffix }}
